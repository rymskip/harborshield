# =============================================================================
# Development Configuration for macOS
# =============================================================================
# Full Docker-in-Docker environment for isolated testing.
#
# Usage:
#   cargo xtask dev --build    # First run (builds image)
#   cargo xtask dev            # Subsequent runs (uses cached image)
#   cargo xtask shell          # Open a shell in the container
#   cargo xtask run            # Build and run harborshield
#   cargo xtask stop           # Stop when done
#
# Or directly:
#   docker-compose -f docker-compose.dev.yml up --build
#
# =============================================================================
# How It Works
# =============================================================================
#
# ┌─────────────────────────────────────────────────────────────────┐
# │  Your Mac                                                       │
# │                                                                 │
# │   cargo xtask dev --build                                       │
# │         │                                                       │
# └─────────┼───────────────────────────────────────────────────────┘
#           │
#           ▼
# ┌─────────────────────────────────────────────────────────────────┐
# │  Docker Desktop's Linux VM                                      │
# │                                                                 │
# │   ┌─────────────────────────────────────────────────────────┐   │
# │   │  harborshield-dev container (Docker-in-Docker)          │   │
# │   │                                                         │   │
# │   │   - Own Docker daemon (isolated from your Mac)          │   │
# │   │   - pixi for Rust toolchain                             │   │
# │   │   - nftables for firewall rules                         │   │
# │   │   - SSH on port 2222 for Zed remote dev                 │   │
# │   │                                                         │   │
# │   │   ┌─────────────────────────────────────────────────┐   │   │
# │   │   │  Inner Docker daemon                            │   │   │
# │   │   │                                                 │   │   │
# │   │   │   - Test containers run here                    │   │   │
# │   │   │   - HarborShield manages these containers       │   │   │
# │   │   │   - Fully isolated from your Mac's Docker       │   │   │
# │   │   └─────────────────────────────────────────────────┘   │   │
# │   └─────────────────────────────────────────────────────────┘   │
# │                                                                 │
# └─────────────────────────────────────────────────────────────────┘
#
# =============================================================================
# What You Can Test
# =============================================================================
#   - Full integration tests with real containers
#   - Container label parsing
#   - nftables rule generation and application
#   - Docker event handling
#   - Database operations
#   - Network isolation testing
#
# The inner Docker daemon is completely isolated, so tests won't
# interfere with containers on your Mac.
# =============================================================================

services:
  harborshield:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: harborshield-dev
    restart: unless-stopped
    privileged: true  # Required for Docker-in-Docker and nftables
    ports:
      - "2222:22"     # SSH for Zed remote development
    volumes:
      # Mount source code for live editing
      - .:/app
      # Persist the inner Docker's data (images, containers)
      - dind-storage:/var/lib/docker
      # Persistent data for harborshield
      - harborshield_data:/data
      # Cache pixi environments
      - pixi-cache:/root/.pixi
    environment:
      RUST_LOG: ${RUST_LOG:-debug}
      RUST_BACKTRACE: "1"
      # Use the inner Docker daemon
      DOCKER_HOST: unix:///var/run/docker.sock
    working_dir: /app
    labels:
      harborshield.enabled: "false"

volumes:
  harborshield_data:
    driver: local
  dind-storage:
    driver: local
  pixi-cache:
    driver: local
